<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}News Desk{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="{% block bodyclass %}{% endblock %}">
<header class="top">
  <a class="brand" href="/">News Desk</a>
  <nav class="langs"><a href="{{ path }}?lang=en"{% if lang == 'en' %} class="on"{% endif %}>EN</a> <a href="{{ path }}?lang=es"{% if lang == 'es' %} class="on"{% endif %}>ES</a></nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
